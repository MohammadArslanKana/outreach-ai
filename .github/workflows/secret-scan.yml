name: Secret Detection

on:
  pull_request:
  push:
    branches:
      - 'security/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan for exposed secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
